syntax = "proto3";
// No Rust `package`: generated Rust types live at the top level, so they map
// 1:1 to the names used across the server (LoginPacket, PlayerStatePacket, ...).
//
// proto3 singular scalars are non-optional in Rust (default 0/false/""), which
// is exactly our semantics: every field is always present on the wire.
//
// The Java/Kotlin options only affect the protobuf-java codegen used by the
// game client; prost ignores them.
option java_multiple_files = true;
option java_package = "io.github.shootgame.proto";

// Client -> server (TCP): request login & room matchmaking.
message LoginPacket {
  string player_name = 1;
  string session_token = 2;
  string room_code = 3;
  string game_mode = 4;
  bool create_room = 5;
}

// Server -> client (TCP): assigned identity + room code + session token.
message LoginResponsePacket {
  uint32 assigned_id = 1;
  float spawn_x = 2;
  float spawn_y = 3;
  string session_token = 4;
  string room_code = 5;
  string game_mode = 6;
  uint32 max_players = 7;
  uint32 current_players = 8;
}

// Bidirectional (server->client UDP/TCP broadcast, client->server TCP/UDP input).
message PlayerStatePacket {
  uint32 id = 1;
  float x = 2;
  float y = 3;
  float cos = 4;
  float sin = 5;
  bool is_attacking = 6;
  bool is_reloading = 7;
  bool is_throwing = 8;
  float health = 9;
  uint32 kills = 10;
  uint32 deaths = 11;
  string player_name = 12;
  uint32 weapon_index = 13;
  string room_code = 14;
}

// Client -> server (TCP) & Server -> client broadcast: a player fired.
message PlayerShootPacket {
  uint32 id = 1;
  uint32 weapon_index = 2;
  float origin_x = 3;
  float origin_y = 4;
  float direction_x = 5;
  float direction_y = 6;
  string room_code = 7;
}

// Server -> client (TCP/UDP): authoritative combat resolution.
message PlayerHitPacket {
  uint32 from_id = 1;
  uint32 to_id = 2;
  float damage = 3;
  float x = 4;
  float y = 5;
  float target_health = 6;
  bool is_kill = 7;
  uint32 attacker_kills = 8;
  uint32 victim_deaths = 9;
  string room_code = 10;
}

// Server -> client: a player joined.
message PlayerConnectedPacket {
  uint32 id = 1;
  float x = 2;
  float y = 3;
  string room_code = 4;
  string player_name = 5;
}

// Server -> client: a player left.
message PlayerDisconnectedPacket {
  uint32 id = 1;
  string room_code = 2;
}
