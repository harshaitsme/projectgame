services:
  shootgame-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: shootgame-server:latest
    container_name: shootgame-server
    restart: unless-stopped
    
    # Explicit port mapping is safer than host networking and works across all OS
    ports:
      - "54555:54555/tcp"
      - "54777:54777/udp"
      - "54556:54556/tcp"
    
    # Load secrets from a local .env file
    env_file:
      - .env
      
    environment:
      SHOOTGAME_TCP_PORT: "54555"
      SHOOTGAME_UDP_PORT: "54777"
      SHOOTGAME_HTTP_PORT: "54556"
      
    # Enable resource limits for stability
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          memory: 256M

    # Ensure the container is actually responsive
    healthcheck:
      test: ["CMD", "curl", "-f", "<unsafe_url>http://localhost:54556/health</unsafe_url>"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Prevent logs from filling up the disk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
