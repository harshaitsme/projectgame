services:
  shootgame-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: shootgame-server:latest
    container_name: shootgame-server
    restart: unless-stopped
    
    # Use host networking to reduce UDP/TCP latency
    network_mode: "host"
    
    environment:
      SHOOTGAME_TCP_PORT: "54555"
      SHOOTGAME_UDP_PORT: "54777"
      SHOOTGAME_HTTP_PORT: "54556"
      FIREBASE_DB_URL: "${FIREBASE_DB_URL}"
      FIREBASE_DB_SECRET: "${FIREBASE_DB_SECRET}"
      
    # Enable resource limits for stability
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          memory: 256M
