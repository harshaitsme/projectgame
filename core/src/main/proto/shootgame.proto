syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.github.shootgame.proto";

// Client -> server (TCP): request login & room matchmaking.
message LoginPacket {
  string player_name = 1;
  string session_token = 2;
  string room_code = 3;
  string game_mode = 4;
  bool create_room = 5;
}

// Server -> client (TCP): assigned identity + room code + session token.
message LoginResponsePacket {
  fixed32 assigned_id = 1;
  float spawn_x = 2;
  float spawn_y = 3;
  string session_token = 4;
  string room_code = 5;
  string game_mode = 6;
  uint32 max_players = 7;
  uint32 current_players = 8;
}

// Bidirectional (server->client UDP/TCP broadcast, client->server TCP/UDP input).
message PlayerStatePacket {
  fixed32 id = 1;
  float x = 2;
  float y = 3;
  float cos = 4;
  float sin = 5;
  // Bitmask for states: 1=attacking, 2=reloading, 4=throwing
  uint32 state_flags = 6; 
  float health = 7;
  uint32 kills = 8;
  uint32 deaths = 9;
  string player_name = 10;
  uint32 weapon_index = 11;
  // room_code removed: assumed to be handled by the connection/session context
}

// Client -> server (TCP) & Server -> client broadcast: a player fired.
message PlayerShootPacket {
  fixed32 id = 1;
  uint32 weapon_index = 2;
  float origin_x = 3;
  float origin_y = 4;
  float direction_x = 5;
  float direction_y = 6;
}

// Server -> client (TCP/UDP): authoritative combat resolution.
message PlayerHitPacket {
  fixed32 from_id = 1;
  fixed32 to_id = 2;
  float damage = 3;
  float x = 4;
  float y = 5;
  float target_health = 6;
  bool is_kill = 7;
  uint32 attacker_kills = 8;
  uint32 victim_deaths = 9;
}

// Server -> client: a player joined.
message PlayerConnectedPacket {
  fixed32 id = 1;
  float x = 2;
  float y = 3;
  string player_name = 4;
}

// Server -> client: a player left.
message PlayerDisconnectedPacket {
  fixed32 id = 1;
}
